name = "abbass-workspace-sync"
main = "index.js"
compatibility_date = "2024-11-01"

# --- D1 database (workspace JSON state) ---
# 1) npx wrangler d1 create abbass-workspace
# 2) paste the returned database_id below
[[d1_databases]]
binding = "DB"
database_name = "abbass-workspace"
database_id = "788dfbbc-3c2e-49ba-9212-3ef397f32f1b"

# --- KV namespace (file attachments) ---
# Files are stored in Workers KV instead of R2 so no payment method is needed.
# Note: KV is eventually consistent (~60s) — fine for personal use.
[[kv_namespaces]]
binding = "FILES"
id = "5b6c4882f0f94b32b7270572eab36f98"
